name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v8

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  build-test:
    name: Build & test (wdio ${{ matrix.wdio }}, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wdio: 10, node-version: '24' }
          # WebdriverIO 9 compatibility: the service supports both majors
          - { wdio: 9, node-version: '22' }
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install WebdriverIO ${{ matrix.wdio }}
        if: matrix.wdio != 10
        run: >-
          npm install --no-save -w @wdio/browserstack-service
          webdriverio@^${{ matrix.wdio }} @wdio/cli@^${{ matrix.wdio }} @wdio/globals@^${{ matrix.wdio }}
          @wdio/logger@^${{ matrix.wdio }} @wdio/reporter@^${{ matrix.wdio }} @wdio/types@^${{ matrix.wdio }}

      - name: Check WebdriverIO version
        run: >-
          npm ls -w @wdio/browserstack-service webdriverio @wdio/types @wdio/reporter @wdio/logger --depth=0 --json
          | node .github/scripts/check-wdio-major.mjs ${{ matrix.wdio }} 4

      # The published build uses the WebdriverIO 10 types
      - name: Build
        if: matrix.wdio == 10
        run: npm run build

      - name: Test
        run: npm test
