# ── CI WORKFLOW (template, v8 maintenance line) ───────────────────────────────
# Inert inside the monorepo fork; lives at the standalone repo's `.github/workflows/ci.yml`
# on the `v8` branch. Builds + tests across the Node versions v8 supports (16/18/20).
# ──────────────────────────────────────────────────────────────────────────────
name: CI (v8)

on:
  pull_request:
  push:
    branches: [v8]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['16.13', '18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test
