# ── RELEASE WORKFLOW (template, v8 maintenance line) ──────────────────────────
# Template for the STANDALONE @wdio/browserstack-service repo's `v8` branch.
# GitHub Actions only reads `.github/workflows` at a repo ROOT — inert inside the
# monorepo fork. In the standalone repo, this lives at `.github/workflows/release.yml`
# on the `v8` branch.
#
# Publishing uses npm "Trusted Publishing" (OIDC) — the SAME per-package trusted
# publisher used by the v9 line (delegation is per-package, so it covers all
# dist-tags). Because package.json has `publishConfig.tag: "v8"`, releases publish
# to the `v8` dist-tag and NEVER touch `latest` (which points at v9).
# ──────────────────────────────────────────────────────────────────────────────
name: Release (v8)

on:
  push:
    branches: [v8]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - name: Create Release PR or publish (v8 dist-tag) to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release # → changeset publish → npm publish (tag from publishConfig.tag = v8)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # Fallback ONLY if Trusted Publishing is not configured (not recommended):
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
